# Spring Application Name
spring.application.name=spring-boot-jpa-rest-api
server.port=8080

# Active Profile: defaults to 'h2' for seamless zero-config execution;
# activate 'mysql' via JVM argument (-Dspring.profiles.active=mysql) or environment variable (SPRING_PROFILES_ACTIVE=mysql)
spring.profiles.active=h2

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
